minimumReleaseAge: 5760
minimumReleaseAgeIgnoreMissingTime: false
ignoreScripts: true
trustPolicy: no-downgrade
engineStrict: true

# Only install peers a package actually declares a need for. With this on,
# pnpm materialises optional peers nobody asked for - which is how Babel 7, and
# with it an unattested semver 6, ended up in the tree and tripped trustPolicy.
autoInstallPeers: false

# Angular 22 pins TypeScript to >=6.0 <6.1 through its peer dependencies, so
# `pnpm up --latest` must not drag it to the next major. Remove this entry when
# upgrading Angular itself.
updateConfig:
  ignoreDependencies:
    - typescript

# zone.js is an optional peer of @angular/core. The applications and the unit
# test setup are zoneless, and the unit-test builder decides whether to emit a
# zone.js import purely by trying to resolve it - so letting pnpm materialise
# this peer silently breaks every test suite.
peerDependencyRules:
  ignoreMissing:
    - zone.js
    # Optional peer of @angular/build, only used to instrument coverage for the
    # Karma builder. Coverage here comes from @vitest/coverage-v8, and pulling
    # it in drags Babel 7 - and with it an unattested semver 6 - into the tree.
    - istanbul-lib-instrument

minimumReleaseAge: 5760
minimumReleaseAgeIgnoreMissingTime: false
ignoreScripts: true
# trustPolicy: no-downgrade
engineStrict: true

# Angular 22 pins TypeScript to >=6.0 <6.1 through its peer dependencies, so
# `pnpm up --latest` must not drag it to the next major. Remove this entry when
# upgrading Angular itself.
updateConfig:
  ignoreDependencies:
    - typescript

# zone.js is an optional peer of @angular/core. The applications and the unit
# test setup are zoneless, and the unit-test builder decides whether to emit a
# zone.js import purely by trying to resolve it - so letting pnpm materialise
# this peer silently breaks every test suite.
peerDependencyRules:
  ignoreMissing:
    - zone.js
